apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-deployment
  namespace: staging
  labels:
    app: eshop
    env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eshop
  template:
    metadata:
      labels:
        app: eshop
        env: staging
    spec:
      containers:
        - name: eshop
          image: ghcr.io/mykhailolevurda/eshop:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eshop-secret
                  key: DATABASE_URL
            - name: NODE_ENV
              value: "staging"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /api/products
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
