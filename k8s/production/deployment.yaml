apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-deployment
  namespace: production
  labels:
    app: eshop
    env: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eshop
  template:
    metadata:
      labels:
        app: eshop
        env: production
    spec:
      containers:
        - name: eshop
          image: ghcr.io/mykhailolevurda/eshop:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eshop-secret
                  key: DATABASE_URL
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/products
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
